<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="description" content="OllyGarden brand guideline, logos, fonts, icons and photography, ready to download.">
<title>OllyGarden Brand Kit</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inconsolata:wght@400;500;700&display=swap">
<style>
  /* OllyGarden Brand Kit. Dark-only, like the product. */
  :root{
    color-scheme:dark;
    --page:#090B0A;
    --well:#161D19;
    --card:#2B362F;
    --active:#415347;
    --edge:rgba(255,255,255,.10);
    --rule:#2B362F;
    --fg:#F6F8F7;
    --fg-2:#BDCBC2;
    --muted:#8AA393;
    --accent:#E3E270;
    --accent-bright:#D1D100;
    --ready:#3DD68C;
    --planned:#D1D100;
    --legacy:#E26D14;
    --side-w:300px;
    --mono:Inconsolata,ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{background:var(--page);}
  body{
    color:var(--fg);
    font-family:"Space Grotesk",system-ui,-apple-system,sans-serif;
    font-size:16px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:1px solid #7c7d7f;outline-offset:2px;}
  svg{display:block;flex:none;}

  /* ---------- header, 64 ---------- */
  .bar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
    height:64px;background:var(--page);
    border-bottom:.625px solid var(--rule);
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:8px 40px 8px 24px;
  }
  .bar-left{display:flex;align-items:center;min-width:0;flex:1 1 auto;}
  .logo{display:flex;align-items:center;gap:8px;width:308px;flex:none;text-decoration:none;}
  .logo img{width:40px;height:32px;}
  .logo span{font-size:24px;font-weight:700;line-height:34px;color:#fff;}
  .trail{display:flex;align-items:center;gap:8px;margin-left:32px;min-width:0;white-space:nowrap;}
  .trail .ico{color:var(--fg-2);}
  .trail .crumb{font-size:18px;line-height:28.8px;color:#fff;overflow:hidden;text-overflow:ellipsis;}
  .trail .sep{font-size:14px;color:var(--muted);margin:0 4px;}
  .trail button.crumb{background:none;border:0;padding:0;cursor:pointer;}
  .trail button.crumb:hover{color:var(--accent);}

  .navigate{
    display:flex;align-items:center;gap:8px;
    width:250px;height:45px;padding:0 10px;flex:none;
    background:var(--page);color:var(--fg-2);
    border:.625px solid var(--active);border-radius:12px;
  }
  .navigate:focus-within{border-color:var(--muted);}
  #filter{
    flex:1 1 auto;min-width:0;height:100%;
    background:transparent;border:0;outline:none;
    color:var(--fg);font:inherit;font-size:16px;font-weight:500;
  }
  #filter::placeholder{color:var(--fg-2);}
  #filter::-webkit-search-cancel-button{filter:invert(.7);}
  .kbd{font-size:12px;color:var(--fg-2);flex:none;}

  /* ---------- body: sidebar + column ---------- */
  .frame{display:flex;align-items:flex-start;}
  .side{
    position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);
    width:var(--side-w);flex:none;
    height:calc(100vh - 96px - env(safe-area-inset-top,0px));
    margin:16px 0 16px 16px;
    background:var(--well);border-radius:20px;
    display:flex;flex-direction:column;
    transition:width .3s ease;
  }
  .side-list{padding:44px 20px 20px;display:flex;flex-direction:column;gap:8px;}
  .nav{
    position:relative;display:flex;align-items:center;gap:12px;
    width:100%;height:53px;padding:12px 16px;border:0;border-radius:8px;
    background:transparent;color:#fff;cursor:pointer;text-align:left;
  }
  .nav:hover{background:rgba(255,255,255,.05);}
  .nav[aria-current="true"]{background:var(--active);}
  .nav .lbl{flex:1 1 auto;font-size:18px;line-height:28.8px;white-space:nowrap;overflow:hidden;}
  .nav .n{font-family:var(--mono);font-size:14px;color:var(--fg-2);font-variant-numeric:tabular-nums;}
  .collapse-row{display:flex;align-items:center;height:40px;margin:0 20px;}
  .collapse-row .line{flex:1 1 auto;border-top:.625px solid var(--rule);}
  .collapse{
    display:inline-flex;align-items:center;justify-content:center;
    width:44px;height:40px;flex:none;border:0;background:none;color:#fff;cursor:pointer;border-radius:8px;
  }
  .collapse:hover{background:rgba(255,255,255,.05);}
  .collapse svg{transition:transform .3s ease;}
  .side-foot{margin-top:auto;padding:20px;}
  .ask{
    display:flex;align-items:center;gap:12px;min-height:42px;padding:8px;
    text-decoration:none;color:#fff;border-radius:8px;
  }
  .ask:hover{background:rgba(255,255,255,.05);}
  .ask .lbl{font-size:18px;font-weight:600;line-height:25px;white-space:nowrap;}
  .ask small{display:block;font-size:13px;font-weight:400;color:var(--muted);line-height:1.3;}

  body.collapsed{--side-w:96px;}
  body.collapsed .nav{justify-content:center;padding:12px 0;}
  body.collapsed .nav .lbl,
  body.collapsed .nav .n,
  body.collapsed .ask .txt,
  body.collapsed .collapse-row .line{display:none;}
  body.collapsed .collapse-row{justify-content:center;margin:0 8px;}
  body.collapsed .collapse svg{transform:rotate(180deg);}
  body.collapsed .side-list{padding-inline:12px;}
  body.collapsed .side-foot{padding:20px 12px;}
  body.collapsed .ask{justify-content:center;}

  .col{flex:1 1 auto;min-width:0;margin-left:16px;display:flex;justify-content:center;}
  .col-in{width:100%;max-width:1680px;padding:16px 32px 96px;display:flex;flex-direction:column;gap:16px;}

  /* ---------- the one card: title + body ---------- */
  .page-card{background:var(--well);border:.625px solid var(--edge);border-radius:20px;overflow:hidden;}
  .title-card{
    background:var(--card);border-bottom:.625px solid var(--edge);border-radius:20px 20px 0 0;
    padding:24px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  }
  .title-card h1{margin:0;display:flex;align-items:center;gap:8px;font-size:28px;font-weight:700;line-height:42px;color:#fff;text-wrap:balance;}
  .title-card .sub{margin:4px 0 0;font-size:16px;line-height:1.6;color:var(--muted);max-width:62ch;}
  .title-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px;max-width:100%;}
  .flow{
    margin:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px;
    font-family:var(--mono);font-size:14px;color:var(--muted);
  }
  .flow b{color:var(--fg);font-weight:500;}

  .tabs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .tab{
    display:inline-flex;align-items:center;gap:6px;height:28px;padding:6px 14px;
    border:0;border-radius:9999px;background:transparent;cursor:pointer;
    font-size:12px;font-weight:500;color:rgba(255,255,255,.70);
  }
  .tab:hover{color:#fff;background:rgba(255,255,255,.06);}
  .tab[aria-pressed="true"]{background:#fff;color:var(--page);}
  .tab .n{font-family:var(--mono);font-size:12px;opacity:.7;font-variant-numeric:tabular-nums;}

  .body{padding:32px;display:flex;flex-direction:column;gap:32px;}
  .count{margin:0;font-family:var(--mono);font-size:14px;color:var(--muted);}

  .group{display:flex;flex-direction:column;}
  .group-head{display:flex;align-items:center;gap:10px;padding-bottom:12px;}
  .group-head .ico{color:var(--fg-2);}
  .group-head h2{margin:0;font-size:20px;font-weight:700;line-height:1.3;color:#fff;}
  .group-head .n{font-family:var(--mono);font-size:14px;color:var(--muted);}
  .group .note{margin:0 0 12px;font-size:15px;color:var(--muted);max-width:66ch;}

  .rows{background:var(--page);border-radius:12px;overflow:hidden;}
  .row{
    display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:center;
    padding:16px 20px;border-top:.625px solid var(--edge);text-decoration:none;color:inherit;
    transition:background-color .15s ease;
  }
  .row:first-child{border-top:0;}
  a.row:hover,a.row:focus-visible{background:rgba(255,255,255,.05);outline:none;}
  a.row:hover .name{color:var(--accent);}
  .row .name{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;line-height:1.35;color:#fff;transition:color .15s ease;}
  .row .name .out{color:var(--muted);opacity:0;transition:opacity .15s ease;}
  a.row:hover .name .out,a.row:focus-visible .name .out{opacity:1;}
  .row.off .name{color:var(--fg-2);}
  .row .desc{grid-column:1;margin:0;font-size:15px;color:var(--muted);max-width:72ch;}
  .row .side-tags{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:8px;justify-content:flex-end;}

  .row.split .name{text-decoration:none;justify-self:start;}
  .row.split .name:hover,.row.split .name:focus-visible{color:var(--accent);outline:none;}
  .row.split .name:hover .out,.row.split .name:focus-visible .out{opacity:1;}
  .src{font-size:13px;color:var(--fg-2);text-decoration:underline;text-decoration-color:var(--active);text-underline-offset:3px;white-space:nowrap;padding:5px 4px;}
  .src:hover{color:var(--accent);text-decoration-color:var(--accent);}
  .tag{
    display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:9999px;
    background:var(--active);color:var(--fg);font-size:13px;font-weight:500;line-height:normal;white-space:nowrap;
  }
  .tag.state{background:transparent;border:.625px solid var(--active);color:var(--fg-2);}
  .dot{width:8px;height:8px;border-radius:9999px;flex:none;}

  /* ---------- home ---------- */
  .home{display:flex;flex-direction:column;gap:16px;}
  .banner{
    position:relative;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
    min-height:280px;padding:40px;
    background-color:var(--card);border:1px solid var(--active);border-radius:20px;
    background-size:cover;background-position:right center;background-repeat:no-repeat;
  }
  .banner.welcome{min-height:400px;}

  /* ---------- the welcome carousel: what is new, one slide at a time ---------- */
  .carousel{position:relative;display:grid;}
  .carousel .slide{grid-area:1 / 1;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s;}
  .carousel .slide.on{opacity:1;visibility:visible;transition:opacity .45s ease,visibility 0s;}
  .carousel .slide .banner-in{padding-bottom:36px;}
  a.btn{text-decoration:none;}
  .car-ctl{
    position:absolute;left:40px;right:40px;bottom:28px;z-index:2;
    display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:none;
  }
  .car-ctl > *{pointer-events:auto;}
  .dots{display:flex;align-items:center;gap:8px;}
  .dot-b{
    width:10px;height:10px;padding:0;border:0;border-radius:9999px;cursor:pointer;
    background:rgba(255,255,255,.35);transition:width .25s ease,background-color .25s ease;
  }
  .dot-b:hover{background:rgba(255,255,255,.6);}
  .dot-b[aria-current="true"]{width:28px;background:var(--accent-bright);}
  .arrows{display:flex;gap:8px;}
  .arrow{
    display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;
    border:1px solid var(--active);border-radius:12px;background:rgba(9,11,10,.6);color:#fff;cursor:pointer;
  }
  .arrow:hover{background:var(--active);}
  /* text keeps to the left half, where the art is left empty for it */
  .banner-in{position:relative;max-width:min(42rem,50%);display:flex;flex-direction:column;align-items:flex-start;}
  .eyebrow{
    display:inline-flex;align-items:center;gap:8px;margin-bottom:20px;
    padding:6px 14px;border-radius:9999px;
    border:1px solid var(--active);background:var(--well);
    font-size:14px;font-weight:600;color:var(--fg-2);
  }
  .eyebrow svg{color:var(--fg-2);}
  .banner h1{margin:0 0 16px;font-size:48px;font-weight:700;line-height:1.4;color:#fff;text-wrap:balance;}
  .banner p{margin:0 0 28px;font-size:18px;line-height:1.6;color:rgba(255,255,255,.70);max-width:60ch;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 20px;
    background:#fff;color:var(--page);border:2px solid #fff;border-radius:12px;
    font:inherit;font-size:16px;font-weight:500;cursor:pointer;
    transition:background-color .15s ease,border-color .15s ease;
  }
  .btn:hover{background:#E6ECE8;border-color:#E6ECE8;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
  .sec-card{
    display:flex;flex-direction:column;overflow:hidden;cursor:pointer;
    background:var(--card);border:1px solid transparent;border-radius:20px;
    transition:border-color .2s ease;
  }
  .sec-card:hover{border-color:var(--edge);}
  .sec-img{
    position:relative;height:160px;border-radius:20px 20px 0 0;overflow:hidden;
    background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;
  }
  .sec-img::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.75);}
  /* a picture keeps more of itself: a lighter wash, darkest where the name sits */
  .sec-img.photo::before{background:linear-gradient(90deg, rgba(0,0,0,.72) 0%, rgba(0,0,0,.35) 100%);}
  .sec-name{position:relative;font-size:16px;font-weight:700;line-height:1.6;color:#fff;}
  .sec-ico{position:relative;color:#fff;}
  .sec-body{flex:1 1 auto;display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:24px 24px 20px;}
  .sec-body .tag svg{color:var(--fg-2);}
  .sec-body p{margin:0;font-size:14px;line-height:1.6;color:rgba(255,255,255,.70);}
  .sec-foot{padding:0 24px 24px;}
  .btn-block{width:100%;justify-content:center;min-height:44px;}
  @media (max-width:1280px){ .sections{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media (max-width:560px){ .sections{grid-template-columns:minmax(0,1fr);} }

  /* ---------- find what you need: shortcuts ---------- */
  /* the shortcuts sit in a well, like every list in the product: nothing floats outside a card */
  .finder{
    display:flex;flex-direction:column;gap:20px;margin-top:0;padding:24px 24px 24px;
    background:var(--well);border:.625px solid var(--edge);border-radius:20px;
  }
  .finder h2{margin:0;font-size:22px;font-weight:700;line-height:1.5;color:#fff;}
  .shortcuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}
  .shortcut{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    min-height:124px;padding:20px 8px;border:1px solid transparent;border-radius:16px;
    background:var(--card);color:#fff;text-decoration:none;cursor:pointer;font:inherit;
    transition:border-color .2s ease,background-color .2s ease;
  }
  .shortcut:hover{border-color:var(--edge);background:#323F37;}
  .shortcut:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .sc-ico{
    display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;
    border-radius:14px;background:var(--well);color:var(--accent-bright);
  }
  .sc-ico .aa{font-size:26px;font-weight:700;line-height:1;letter-spacing:-.02em;}
  .sc-ico svg{width:26px;height:26px;}
  .sc-ico .aa{font-size:22px;}
  .sc-lbl{font-size:15px;font-weight:500;line-height:1.3;text-align:center;}
  @media (max-width:820px){ .shortcuts{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media (max-width:560px){ .shortcuts{grid-template-columns:repeat(2,minmax(0,1fr));} .finder{padding:20px 16px;} }

  .empty{padding:32px 20px;color:var(--muted);font-size:15px;}

  /* ---------- footer, fixed like the product's ---------- */
  .foot{
    position:fixed;left:calc(var(--side-w) + 32px);right:0;bottom:0;z-index:20;
    padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));
    background:rgba(9,11,10,.80);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    border-top:.625px solid var(--edge);
    font-size:12px;color:rgba(255,255,255,.60);
    transition:left .3s ease;
  }
  .foot-in{display:flex;align-items:center;justify-content:space-between;gap:16px;max-width:1400px;min-height:44px;margin:0 auto;flex-wrap:wrap;}
  .foot-in span{padding:8px 32px;}
  .foot nav{display:flex;gap:16px;flex-wrap:wrap;}
  .foot a{padding:4px 8px;text-decoration:none;min-height:44px;display:flex;align-items:center;}
  .foot a:hover{color:var(--accent);}

  /* ---------- compact nav, under 820 like the product ---------- */
  .chips{display:none;}
  @media (max-width:1100px){
    .logo{width:auto;}
    .navigate{width:220px;}
  }
  @media (max-width:819px){
    .bar{height:56px;padding:0 16px;}
    .trail{display:none;}
    .logo img{width:32px;height:26px;}
    .logo span{font-size:20px;}
    .navigate{width:auto;flex:1 1 auto;max-width:260px;height:40px;}
    .navigate .kbd{display:none;}
    .side{display:none;}
    .col{margin-left:0;}
    .col-in{padding:12px 16px 48px;}
    .chips{
      display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;
      scrollbar-width:none;
    }
    .chips::-webkit-scrollbar{display:none;}
    .chips .nav{width:auto;height:40px;padding:8px 14px;flex:none;background:var(--well);border-radius:9999px;}
    .chips .nav[aria-current="true"]{background:var(--active);}
    .chips .nav .lbl{font-size:15px;}
    .title-card{padding:20px;}
    .title-card h1{font-size:24px;line-height:34px;}
    .title-side{align-items:flex-start;}
    .flow{justify-content:flex-start;}
    .body{padding:20px 16px;gap:28px;}
    .banner,.banner.welcome{min-height:0;padding:24px;background-image:none!important;}
    .banner-in{max-width:none;}
    .banner h1{font-size:32px;margin-bottom:12px;}
    .car-ctl{left:24px;right:24px;bottom:20px;}
    .carousel .slide .banner-in{padding-bottom:56px;}
    .banner p{font-size:16px;margin-bottom:24px;}
    .row{grid-template-columns:minmax(0,1fr);padding:14px 16px;}
    .row .side-tags{grid-column:1;grid-row:auto;justify-content:flex-start;margin-top:8px;}
    .foot{position:static;padding-inline:16px;background:transparent;backdrop-filter:none;}
    .foot-in span{padding:8px 0;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body>
<header class="bar">

12.0002Z\" fill=\"currentColor\"/>     <path d=\"M7.07524 13.9999C7.02524 14.3333 7.00018 14.6669 7.00018 15.0002C7.00018 15.3335 7.02524 15.6672 7.07524 16.0005H4.00022V13.9999H7.07524Z\" fill=\"currentColor\"/>     <path d=\"M9.12469 10.0004C8.82482 10.2837 8.55408 10.592 8.3125 10.9253C8.07087 11.2586 7.85821 11.6169 7.67489 12.0002H4.00022V10.0004H9.12469Z\" fill=\"currentColor\"/>   </g>", "share": "<g transform=\"translate(3.2500 2.0000) scale(1.250000)\">     <path d=\"M11.6667 16C11.0185 16 10.4676 15.7667 10.0139 15.3C9.56019 14.8333 9.33333 14.2667 9.33333 13.6C9.33333 13.52 9.35278 13.3333 9.39167 13.04L3.92778 9.76C3.72037 9.96 3.48056 10.1167 3.20833 10.23C2.93611 10.3433 2.64444 10.4 2.33333 10.4C1.68519 10.4 1.13426 10.1667 0.680556 9.7C0.226852 9.23333 0 8.66667 0 8C0 7.33333 0.226852 6.76667 0.680556 6.3C1.13426 5.83333 1.68519 5.6 2.33333 5.6C2.64444 5.6 2.93611 5.65667 3.20833 5.77C3.48056 5.88333 3.72037 6.04 3.92778 6.24L9.39167 2.96C9.36574 2.86667 9.34954 2.77667 9.34306 2.69C9.33657 2.60333 9.33333 2.50667 9.33333 2.4C9.33333 1.73333 9.56019 1.16667 10.0139 0.7C10.4676 0.233333 11.0185 0 11.6667 0C12.3148 0 12.8657 0.233333 13.3194 0.7C13.7731 1.16667 14 1.73333 14 2.4C14 3.06667 13.7731 3.63333 13.3194 4.1C12.8657 4.56667 12.3148 4.8 11.6667 4.8C11.3556 4.8 11.0639 4.74333 10.7917 4.63C10.5194 4.51667 10.2796 4.36 10.0722 4.16L4.60833 7.44C4.63426 7.53333 4.65046 7.62333 4.65694 7.71C4.66343 7.79667 4.66667 7.89333 4.66667 8C4.66667 8.10667 4.66343 8.20333 4.65694 8.29C4.65046 8.37667 4.63426 8.46667 4.60833 8.56L10.0722 11.84C10.2796 11.64 10.5194 11.4833 10.7917 11.37C11.0639 11.2567 11.3556 11.2 11.6667 11.2C12.3148 11.2 12.8657 11.4333 13.3194 11.9C13.7731 12.3667 14 12.9333 14 13.6C14 14.2667 13.7731 14.8333 13.3194 15.3C12.8657 15.7667 12.3148 16 11.6667 16Z\" fill=\"currentColor\"/>   </g>"};
const SHORTCUTS = [
  {label: "Logos", glyph: "brand", url: "https://drive.google.com/drive/folders/1JJFkDPgwdTp8MfTOyO_ZPJlqq21IFL6M"},
  {label: "Fonts", glyph: "type", url: "https://drive.google.com/drive/folders/1hgZ4DpkRXV64vc12WfCvmxjkS9mAvE0L"},
  {label: "Icons", glyph: "grid", url: "https://claude.ai/artifact/PyAfco8XFhKr6W7MbvcwmY"},
  {label: "Photos", glyph: "image", url: "https://claude.ai/artifact/Xgzs6HAqZWKKtaM69oJzQH"},
  {label: "Guidelines", glyph: "guides", open: "Guidelines"},
];
function shortcutGlyph(g){
  if (g === "brand") return ICON.Brand.replace('width="20" height="20"', 'width="30" height="30"');
  if (g === "guides") return ICON.Guidelines.replace('width="20" height="20"', 'width="30" height="30"');
  if (g === "type") return `<span class="aa" aria-hidden="true">Aa</span>`;
  return `<svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" aria-hidden="true">${GLYPH[g]}</svg>`;
}
let slide = 0, slideTimer = null;

const STATES = [
  {id:"all", label:"All"},
  {id:"ready", label:"Ready", hint:"Opens and is current."},
  {id:"beta", label:"Beta", hint:"Works, and we are still listening for what breaks."},
  {id:"planned", label:"Planned", hint:"Does not exist yet, or is not the standard yet."}
];
const DOT = {ready:"var(--ready)", beta:"var(--accent-bright)", planned:"var(--planned)",
             legacy:"var(--legacy)"};
const SUBS = {
  all: "Everything you need to use the OllyGarden brand."
};

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

let group = "all";
let state = "all";

const matches = (it, term) => !term ||
  (it.name+" "+it.desc+" "+it.surface+" "+it.state+" "+(it.kw||"")).toLowerCase().includes(term);

function navHTML(){
  const all = DATA.reduce((n,g)=>n+g.items.length,0);
  const entries = [{id:"all", label:"Home", n:""}, ...DATA.map(g=>({id:g.group, label:g.group, n:g.items.length}))];
  return entries.map(e => `<button class="nav" type="button" data-g="${esc(e.id)}" aria-current="${e.id===group}" title="${esc(e.label)}">
      <span>${ICON[e.id]}</span><span class="lbl">${esc(e.label)}</span><span class="n">${e.n}</span>
    </button>`).join("");
}

function rowHTML(it){
  const src = it.src ? `<a class="src" href="${esc(it.src.url)}" target="_blank" rel="noopener">${esc(it.src.label)}</a>` : "";
  const tags = `<div class="side-tags">${src}
      <span class="tag">${esc(it.surface)}</span>
      ${it.state === "ready" ? "" : `<span class="tag state"><span class="dot" style="background:${DOT[it.state]}"></span>${it.state[0].toUpperCase()+it.state.slice(1)}</span>`}
    </div>`;
  if (it.src) {
    return `<div class="row split"><a class="name" href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)}<span class="out">${ICON.out}</span></a>
    <p class="desc">${esc(it.desc)}</p>${tags}</div>`;
  }
  const inner = `<span class="name">${esc(it.name)}${it.url ? `<span class="out">${ICON.out}</span>` : ""}</span>
    <p class="desc">${esc(it.desc)}</p>${tags}`;
  return it.url
    ? `<a class="row" href="${esc(it.url)}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="row off">${inner}</div>`;
}

function render(){
  const term = $("filter").value.trim().toLowerCase();

  $("side-list").innerHTML = navHTML();
  $("chips").innerHTML = navHTML();
  document.querySelectorAll(".nav[data-g]").forEach(b => b.addEventListener("click", () => {
    group = b.dataset.g; store.set("hub-group", group); render();
    window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
  }));

  const g = DATA.find(d => d.group === group);
  const home = !g && !term;
  $("banners").hidden = !home;
  $("page-card").hidden = home;
  if (home) {
    const SCRIM = "linear-gradient(120deg, rgba(9,10,11,0.72) 0%, rgba(9,10,11,0.3) 55%, rgba(9,10,11,0) 100%)";
    const total = DATA.reduce((n, d) => n + d.items.length, 0);
    const small = n => ICON[n].replace('width="20" height="20"', 'width="16" height="16"');
    // these arts have no empty dark half, so the wash holds the text side darker for longer
    const NEWS_SCRIM = "linear-gradient(90deg, rgba(9,11,10,0.94) 0%, rgba(9,11,10,0.86) 42%, rgba(9,11,10,0.2) 100%)";
    const artOf = n => n === "brand-pattern" ? CARD_ART.Brand.src : (n || CARD_BG);
    const slides = [`<section class="banner welcome slide" style="background-image:${SCRIM}, url('${WELCOME_ART}')" aria-labelledby="welcome" aria-roledescription="slide" aria-label="1 of ${NEWS.length + 1}">
        <div class="banner-in">
          <span class="eyebrow">Last reviewed &middot; 1 October 2026</span>
          <h1 id="welcome">Welcome to the OllyGarden Brand Kit</h1>
          <p>Everything you need to use the OllyGarden brand: the brand guideline, the logos, the fonts, the icons and the photography, ready to download. ${total} entries, in two sections.</p>
        </div>
      </section>`, ...NEWS.map((n, i) => `<section class="banner welcome slide" style="background-image:${n.darkLeft ? SCRIM : NEWS_SCRIM}, url('${artOf(n.art)}')" aria-labelledby="news-${i}" aria-roledescription="slide" aria-label="${i + 2} of ${NEWS.length + 1}">
        <div class="banner-in">
          <span class="eyebrow">${n.eyebrow}</span>
          <h1 id="news-${i}">${esc(n.title)}</h1>
          <p>${esc(n.text)}</p>
          <a class="btn" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.cta)}${ICON.chev}</a>
        </div>
      </section>`)];
    const titles = ["Welcome", ...NEWS.map(n => n.title)];
    $("banners").innerHTML = `<div class="carousel" id="carousel" role="region" aria-roledescription="carousel" aria-label="What is new">
        ${slides.join("")}
        <div class="car-ctl">
          <div class="dots">${titles.map((t, i) => `<button class="dot-b" type="button" data-slide="${i}" aria-label="Slide ${i + 1}: ${esc(t)}"></button>`).join("")}</div>
          <div class="arrows">
            <button class="arrow" type="button" data-step="-1" aria-label="Previous slide"><span style="transform:rotate(180deg);display:inline-flex">${ICON.chev}</span></button>
            <button class="arrow" type="button" data-step="1" aria-label="Next slide">${ICON.chev}</button>
          </div>
        </div>
      </div>
      <div class="sections">${DATA.map(d => {
        const n = d.items.length;
        return `<article class="sec-card" data-open="${esc(d.group)}">
          <div class="sec-img${CARD_ART[d.group] ? " photo" : ""}" style="background-image:url('${CARD_ART[d.group] ? CARD_ART[d.group].src : CARD_BG}');background-position:${CARD_ART[d.group] ? CARD_ART[d.group].pos : "center"}">
            <span class="sec-name">${esc(d.group)}</span>
            <span class="sec-ico">${ICON[d.group].replace('width="20" height="20"', 'width="32" height="32"')}</span>
          </div>
          <div class="sec-body">
            <span class="tag">${small(d.group)}${n} ${n === 1 ? "entry" : "entries"}</span>
            <p>${esc(d.blurb || d.note)}</p>
          </div>
          <div class="sec-foot"><button class="btn btn-block" type="button" data-open="${esc(d.group)}" aria-label="Open ${esc(d.group)}">Open ${esc(d.group)}</button></div>
        </article>`;
      }).join("")}</div>
      <section class="finder" aria-labelledby="finder-h">
        <h2 id="finder-h">Find what you need</h2>
        <div class="shortcuts">${SHORTCUTS.map(c => c.open
          ? `<button class="shortcut" type="button" data-open="${esc(c.open)}"><span class="sc-ico">${shortcutGlyph(c.glyph)}</span><span class="sc-lbl">${esc(c.label)}</span></button>`
          : `<a class="shortcut" href="${esc(c.url)}" target="_blank" rel="noopener"><span class="sc-ico">${shortcutGlyph(c.glyph)}</span><span class="sc-lbl">${esc(c.label)}</span></a>`).join("")}</div>
      </section>`;
    showSlide(slide);
    const car = $("carousel");
    car.querySelectorAll("[data-slide]").forEach(b => b.addEventListener("click", () => { showSlide(+b.dataset.slide); startSlides(); }));
    car.querySelectorAll("[data-step]").forEach(b => b.addEventListener("click", () => { showSlide(slide + +b.dataset.step); startSlides(); }));
    car.addEventListener("mouseenter", stopSlides);
    car.addEventListener("mouseleave", startSlides);
    car.addEventListener("focusin", stopSlides);
    car.addEventListener("focusout", e => { if (!car.contains(e.relatedTarget)) startSlides(); });
    car.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") { showSlide(slide + 1); }
      if (e.key === "ArrowLeft") { showSlide(slide - 1); }
    });
    let x0 = null;
    car.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive: true});
    car.addEventListener("touchend", e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) { showSlide(slide + (dx < 0 ? 1 : -1)); startSlides(); }
    });
    startSlides();
    $("banners").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", e => {
      e.stopPropagation();
      group = b.dataset.open; store.set("hub-group", group); render(); window.scrollTo({top:0});
    }));
  }

  if (!home) stopSlides();
  $("title").textContent = g ? g.group : "Brand Kit";
  // the title wears the same glyph as the menu row that opened it, at 24
  $("title-ico").innerHTML = ICON[g ? g.group : "all"].replace('width="20" height="20"', 'width="24" height="24"');
  $("sub").textContent = g ? g.note : SUBS.all;
  $("crumb-tail").hidden = !g;
  $("crumb-group").textContent = g ? g.group : "";

  // state tabs count what the group and search leave
  const scope = DATA.filter(d => !g || d === g).flatMap(d => d.items).filter(it => matches(it, term));
  // The status filter only earns its place when something is not ready yet.
  const mixed = DATA.some(d => d.items.some(it => it.state !== "ready"));
  $("states").hidden = !mixed;
  if (!mixed) state = "all";
  $("states").innerHTML = STATES.map(s => {
    const n = s.id === "all" ? scope.length : scope.filter(it => it.state === s.id).length;
    return `<button class="tab" type="button" data-s="${s.id}" aria-pressed="${s.id===state}"${s.hint ? ` title="${esc(s.hint)}"` : ""}>${s.label}<span class="n">${n}</span></button>`;
  }).join("");
  $("states").querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { state = b.dataset.s; render(); }));

  let shown = 0, total = 0;
  const html = DATA.map(d => {
    total += d.items.length;
    if (g && d !== g) return "";
    const items = d.items.filter(it => matches(it, term) && (state === "all" || it.state === state));
    shown += items.length;
    if (!items.length) return "";
    return `<section class="group" aria-labelledby="g-${esc(d.group).replace(/\W/g,'')}">
      ${g ? "" : `<div class="group-head"><span class="ico">${ICON[d.group]}</span><h2 id="g-${esc(d.group).replace(/\W/g,'')}">${esc(d.group)}</h2><span class="n">${items.length}</span></div>
      <p class="note">${esc(d.note)}</p>`}
      <div class="rows">${items.map(rowHTML).join("")}</div>
    </section>`;
  }).join("");

  $("groups").innerHTML = html || `<div class="rows"><p class="empty">Nothing matches that. Try “logo”, “icons”, “fonts”, “slides” or “colours”, or ask in #design.</p></div>`;
  const filtered = term || state !== "all" || g;
  $("count").textContent = filtered ? `${shown} of ${total} entries` : `${total} entries`;
}

function showSlide(i){
  const car = $("carousel"); if (!car) return;
  const all = car.querySelectorAll(".slide");
  slide = (i + all.length) % all.length;
  all.forEach((el, k) => { el.classList.toggle("on", k === slide); el.setAttribute("aria-hidden", String(k !== slide)); el.inert = k !== slide; });
  car.querySelectorAll(".dot-b").forEach((d, k) => d.setAttribute("aria-current", String(k === slide)));
}
function stopSlides(){ clearInterval(slideTimer); slideTimer = null; }
function startSlides(){
  stopSlides();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  slideTimer = setInterval(() => showSlide(slide + 1), SLIDE_MS);
}

function setCollapsed(on){
  document.body.classList.toggle("collapsed", on);
  $("collapse").setAttribute("aria-expanded", String(!on));
  $("collapse").setAttribute("aria-label", on ? "Expand sidebar" : "Collapse sidebar");
}

group = store.get("hub-group") || "all";
if (group !== "all" && !DATA.some(d => d.group === group)) group = "all";
setCollapsed(store.get("hub-collapsed") === "1");

$("collapse").addEventListener("click", () => {
  const on = !document.body.classList.contains("collapsed");
  setCollapsed(on); store.set("hub-collapsed", on ? "1" : "0");
});
const goHome = e => { e.preventDefault(); group = "all"; state = "all"; $("filter").value = ""; store.set("hub-group","all"); render(); window.scrollTo({top:0}); };
$("home").addEventListener("click", goHome);
$("crumb-root").addEventListener("click", goHome);
$("filter").addEventListener("input", render);
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== $("filter") && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) {
    e.preventDefault(); $("filter").focus();
  }
});

render();
</script>
</body>
</html>
